services:
  media-downloader:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev-stage
    container_name: media-downloader-dev
    ports:
      - "5000:8000"
    volumes:
      - ./backend:/app
      - ./downloads:/app/downloads
      - ./cookies:/app/cookies
    environment:
      - MD_DEBUG=true
      - MD_FILE_RETENTION_HOURS=0.5
      - MD_CLEANUP_INTERVAL_MINUTES=10
      - PYTHONUNBUFFERED=1
      # Local machine: use the whole host instead of the 1 vCPU production limits.
      # Any value can be overridden from a .env file next to this compose file.
      - MD_MAX_CONCURRENT_DOWNLOADS=${MD_MAX_CONCURRENT_DOWNLOADS:-8}
      - MD_CONCURRENT_FRAGMENT_DOWNLOADS=${MD_CONCURRENT_FRAGMENT_DOWNLOADS:-8}
      - MD_COMPRESSION_CPU_CORES=${MD_COMPRESSION_CPU_CORES:-0}  # 0 = all cores
      # One encode using all cores: lowest latency for a single user
      - MD_COMPRESSION_MAX_CONCURRENT_JOBS=${MD_COMPRESSION_MAX_CONCURRENT_JOBS:-1}
      - MD_COMPRESSION_MAX_JOBS_PER_USER=${MD_COMPRESSION_MAX_JOBS_PER_USER:-10}
      - MD_COMPRESSION_MAX_JOBS_PER_IP=${MD_COMPRESSION_MAX_JOBS_PER_IP:-10}
      - MD_COMPRESSION_MAX_QUEUE_LENGTH=${MD_COMPRESSION_MAX_QUEUE_LENGTH:-20}
      - MD_COMPRESSION_MAX_TOTAL_WAIT_SEC=${MD_COMPRESSION_MAX_TOTAL_WAIT_SEC:-14400}
      - MD_COMPRESSION_MAX_INPUT_DURATION_SEC=${MD_COMPRESSION_MAX_INPUT_DURATION_SEC:-14400}
      - MD_COMPRESSION_MAX_INPUT_HEIGHT=${MD_COMPRESSION_MAX_INPUT_HEIGHT:-2160}
      - MD_COMPRESSION_MAX_INPUT_FILE_MB=${MD_COMPRESSION_MAX_INPUT_FILE_MB:-20000}
      - MD_COMPRESSION_SAFETY_FACTOR=${MD_COMPRESSION_SAFETY_FACTOR:-1.2}
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload