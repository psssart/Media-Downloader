services:
  media-downloader:
    image: pasubi/media-downloader:latest
    container_name: media-downloader
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8000"
    volumes:
      # Persistent storage for downloads
      - ./downloads:/app/downloads
      # Persistent storage for cookies
      - ./cookies:/app/cookies
    environment:
      # File retention in hours (0.5 = 30 minutes)
      - MD_FILE_RETENTION_HOURS=0.5
      # Cleanup interval in minutes
      - MD_CLEANUP_INTERVAL_MINUTES=10
      # Max concurrent downloads (default: 3)
      - MD_MAX_CONCURRENT_DOWNLOADS=3
      # Video compression: defaults fit 1 vCPU / 3.5 GB / 20 GB.
      # See README "Video compression" before changing these.
      # - MD_COMPRESSION_CPU_CORES=1
      # - MD_COMPRESSION_MAX_TOTAL_WAIT_SEC=1800
    # Hard cap for the whole container. ffmpeg runs with oom_score_adj=1000, so if
    # the cap is hit the kernel kills the encoder (job fails) and not the web app.
    mem_limit: 2g
    memswap_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Optional: Add network for reverse proxy setup
networks:
  default:
    name: media-downloader-network
